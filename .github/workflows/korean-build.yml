name: Korean build (arm64)

on:
  push:
    branches: [main]
    # A change to the README or other docs is not a new app version.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korean-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Signing setup
        env:
          KO_KEYSTORE_BASE64: ${{ secrets.KO_KEYSTORE_BASE64 }}
          KO_KEYSTORE_PASSWORD: ${{ secrets.KO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KO_KEYSTORE_BASE64" ]; then
            echo "$KO_KEYSTORE_BASE64" | base64 -d > bitchord-ko.p12
          fi
          if [ -f bitchord-ko.p12 ] && [ -n "$KO_KEYSTORE_PASSWORD" ]; then
            {
              echo "storeFile=bitchord-ko.p12"
              echo "storePassword=$KO_KEYSTORE_PASSWORD"
              echo "keyAlias=bitchordko"
              echo "keyPassword=$KO_KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "Signing with the fork's own key."
          else
            echo "::warning::No signing key configured; signing with a throwaway debug key (reinstall needed on update)."
          fi

      - name: Version
        id: version
        run: |
          # Upstream's version, read from the one place it is set, then this
          # run's number: 1.9.1-ko.7. See koBuild in app/build.gradle.kts.
          BASE=$(sed -n 's/^extra\["bitchordVersionName"\] = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ -z "$BASE" ]; then echo "::error::bitchordVersionName not found in build.gradle.kts"; exit 1; fi
          VERSION="$BASE-ko.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=BitChord-KO-$VERSION-arm64.apk" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease -Pbitchord.arm64Only=true \
            -Pbitchord.koBuild=${{ github.run_number }} \
            -Pbitchord.updateRepo=${{ github.repository }} \
            --stacktrace

      - name: Collect APK
        run: |
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          mkdir -p out
          cp "$APK" "out/${{ steps.version.outputs.apk }}"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-KO-${{ steps.version.outputs.version }}
          path: out/${{ steps.version.outputs.apk }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "out/${{ steps.version.outputs.apk }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "BitChord KO ${{ steps.version.outputs.version }}" \
            --notes "버전 ${{ steps.version.outputs.version }} (빌드 ${{ github.run_number }}, 커밋 ${GITHUB_SHA::7}). 휴대폰에서 ${{ steps.version.outputs.apk }} 를 눌러 받은 뒤 설치하십시오."
