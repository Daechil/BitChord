name: Korean build (arm64)

on:
  push:
    # main builds the stable release; beta builds a pre-release, offered only to
    # those who turned on "Get beta versions". One run number for both, so a
    # later stable build always installs over an earlier beta.
    branches: [main, beta]
    # A change to the README or other docs is not a new app version.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A beta build never cancels a stable one, nor the other way round.
  group: korean-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Signing setup
        env:
          KO_KEYSTORE_BASE64: ${{ secrets.KO_KEYSTORE_BASE64 }}
          KO_KEYSTORE_PASSWORD: ${{ secrets.KO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KO_KEYSTORE_BASE64" ]; then
            echo "$KO_KEYSTORE_BASE64" | base64 -d > bitchord-ko.p12
          fi
          if [ -f bitchord-ko.p12 ] && [ -n "$KO_KEYSTORE_PASSWORD" ]; then
            {
              echo "storeFile=bitchord-ko.p12"
              echo "storePassword=$KO_KEYSTORE_PASSWORD"
              echo "keyAlias=bitchordko"
              echo "keyPassword=$KO_KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "Signing with the fork's own key."
          else
            # A release signed with a throwaway key cannot install over the app,
            # and the in-app updater would offer it anyway: no release at all.
            echo "::error::No signing key (KO_KEYSTORE_BASE64 / KO_KEYSTORE_PASSWORD); refusing to publish a debug-signed release."
            exit 1
          fi

      - name: Version
        id: version
        run: |
          # Upstream's version, read from the one place it is set, then this
          # run's number: 1.9.1-ko.7. See koBuild in app/build.gradle.kts.
          BASE=$(sed -n 's/^extra\["bitchordVersionName"\] = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ -z "$BASE" ]; then echo "::error::bitchordVersionName not found in build.gradle.kts"; exit 1; fi
          SUFFIX=""
          CHANNEL="stable"
          if [ "${{ github.ref_name }}" = "beta" ]; then SUFFIX="-beta"; CHANNEL="beta"; fi
          VERSION="$BASE-ko.${{ github.run_number }}$SUFFIX"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=BitChord-KO-$VERSION-arm64.apk" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build
        env:
          # KO: the Korean build's own listen-together server (backend/, on Vultr Seoul).
          LISTEN_TOGETHER_SERVER: https://jam.kobitchord.org
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease -Pbitchord.arm64Only=true \
            -Pbitchord.koBuild=${{ github.run_number }} \
            -Pbitchord.koChannel=${{ steps.version.outputs.channel }} \
            -Pbitchord.updateRepo=${{ github.repository }} \
            --stacktrace

      - name: Collect APK
        run: |
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          mkdir -p out
          cp "$APK" "out/${{ steps.version.outputs.apk }}"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-KO-${{ steps.version.outputs.version }}
          path: out/${{ steps.version.outputs.apk }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What changed in this build, from its entry in KO_CHANGELOG.md.
          python3 .github/scripts/ko_release_notes.py build \
            --tag "v${{ steps.version.outputs.version }}" \
            --commit "${{ github.sha }}" \
            --apk "${{ steps.version.outputs.apk }}" \
            --out "$RUNNER_TEMP/release-notes.md"
          # A beta is a pre-release: GitHub's "latest release", which the
          # stable builds ask for, never points at one.
          if [ "${{ steps.version.outputs.channel }}" = "beta" ]; then
            CHANNEL_FLAGS="--prerelease --latest=false"
            TITLE="BitChord KO ${{ steps.version.outputs.version }} (베타)"
          else
            CHANNEL_FLAGS="--latest"
            TITLE="BitChord KO ${{ steps.version.outputs.version }}"
          fi
          gh release create "v${{ steps.version.outputs.version }}" "out/${{ steps.version.outputs.apk }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $CHANNEL_FLAGS
