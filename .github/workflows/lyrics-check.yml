name: Lyrics match check

# Run by hand. Asks the real lyrics sources about ~35 real songs and writes a
# table of which ones answered with the same song's words as the others. No
# lyrics are printed: only titles, artists, lengths and a similarity score.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Check
        env:
          LIVE_LYRICS: '1'
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.LiveLyricsCheck' --rerun --no-daemon

      - name: Report
        if: always()
        run: |
          if [ -f live-lyrics.md ]; then
            cat live-lyrics.md
            cat live-lyrics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written."
          fi
