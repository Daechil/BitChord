name: Lyrics match check

# Run by hand. Asks the real lyrics sources about ~35 real songs and writes a
# table of which ones answered with the same song's words as the others. No
# lyrics are printed: only titles, artists, lengths and a similarity score.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Songs to look at closely instead, separated by semicolons, e.g. Worlds Smallest Violin AJR'
        required: false
        default: ''
      radio:
        description: 'Radio seeds to check for songs held to be one, separated by semicolons'
        required: false
        default: ''
      namu:
        description: 'Set to yes to try reading song articles from namu.wiki'
        required: false
        default: ''
      sources:
        description: 'Set to yes to try free song-background sources (VocaDB, Wikipedia, Genius, AnimeThemes)'
        required: false
        default: ''
      translate:
        description: 'A song to translate the way the app does and have Sonnet review (needs ANTHROPIC_API_KEY; about 100 won)'
        required: false
        default: ''
      sources_ko:
        description: 'Songs to look for Korean lyric translations made by people, separated by semicolons'
        required: false
        default: ''
      claude_search:
        description: 'Set to yes to try Claude web search (needs the ANTHROPIC_API_KEY secret; costs a few cents)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Check
        if: inputs.probe == '' && inputs.radio == '' && inputs.claude_search == '' && inputs.sources == '' && inputs.namu == '' && inputs.translate == '' && inputs.sources_ko == ''
        env:
          LIVE_LYRICS: '1'
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.LiveLyricsCheck' --rerun --no-daemon

      - name: Probe
        if: inputs.probe != ''
        env:
          LIVE_PROBE: ${{ inputs.probe }}
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.LyricsProbe' --rerun --no-daemon

      - name: Radio
        if: inputs.radio != ''
        env:
          LIVE_RADIO: ${{ inputs.radio }}
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.playback.RadioDedupeProbe' --rerun --no-daemon

      - name: Song background (app code)
        if: inputs.claude_search == 'app'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SONG_BACKGROUND_PROBE: '1'
          BACKGROUND_SONGS: '抜錨 / ナナホシ管弦楽団 — 월피스 카터; テトリス — 柊マグネタイト; 人マニア — 原口沙輔'
          BACKGROUND_MODELS: 'haiku,sonnet'
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.SongBackgroundProbe' --rerun --no-daemon

      - name: Korean translations by people
        if: inputs.sources_ko != ''
        env:
          TRANSLATION_SOURCES: ${{ inputs.sources_ko }}
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.TranslationSourcesProbe' --rerun --no-daemon

      - name: Translation review
        if: inputs.translate != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATION_PROBE: ${{ inputs.translate }}
          TRANSLATION_INSTRUCTIONS: '노래에 대해 검색 후 노래의 배경에 맞게 의역할 것'
          TRANSLATION_INSTRUCTIONS_B: |-
            같은 발음에 두 뜻을 겹친 말장난은 두 뜻이 모두 느껴지게 옮길 것.
            한자어나 예스러운 표현은 사전 뜻을 지키되, 노래 가사처럼 짧고 자연스러운 우리말로 옮길 것.
            원문에 없는 감정이나 설명은 덧붙이지 말 것.
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.TranslationProbe' --rerun --no-daemon

      - name: Claude web search
        if: inputs.claude_search != '' && inputs.claude_search != 'app' && inputs.claude_search != 'fetch' && inputs.claude_search != 'cache' && inputs.claude_search != 'tidy'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_SEARCH_CASES: ${{ inputs.claude_search }}
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: python3 .github/scripts/claude_search_check.py

      - name: Queue tidy (app code)
        if: inputs.claude_search == 'tidy'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUEUE_TIDY_PROBE: '1'
          QUEUE_TIDY_SET: '2'
          QUEUE_TIDY_RUNS: '2'
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.QueueTidyProbe' --rerun --no-daemon

      - name: Prompt cache (app code)
        if: inputs.claude_search == 'cache'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CACHE_PROBE: '抜錨 ナナホシ管弦楽団; アイドル YOASOBI; Lemon 米津玄師'
          CACHE_MODELS: 'haiku'
          TRANSLATION_INSTRUCTIONS: '노래에 대해 검색 후 노래의 배경에 맞게 의역할 것'
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.data.lyrics.CacheProbe' --rerun --no-daemon

      - name: namu.wiki fetch (Claude)
        if: inputs.claude_search == 'fetch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: python3 .github/scripts/namu_fetch_check.py

      - name: Background sources
        if: inputs.sources != ''
        env:
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: python3 .github/scripts/background_sources_check.py

      - name: namu.wiki
        if: inputs.namu != ''
        env:
          LIVE_LYRICS_REPORT: ${{ github.workspace }}/live-lyrics.md
        run: python3 .github/scripts/namuwiki_check.py

      - name: Report
        if: always()
        run: |
          if [ -f live-lyrics.md ]; then
            cat live-lyrics.md
            cat live-lyrics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written."
          fi
